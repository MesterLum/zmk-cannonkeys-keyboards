# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
# Currently only building the Link split keyboard. Other CannonKeys boards
# are kept below, commented out, so they can be re-enabled by uncommenting.
# board: ["minimi40"]
include:
  - board: link_right
    shield: nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: link_right_studio
  - board: link_left
    shield: nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: link_left_studio
  # settings_reset firmware: flash on each half once to clear stored BLE
  # bonds and ZMK settings, then re-flash the regular firmware on both.
  - board: link_left
    shield: settings_reset
    artifact-name: link_left_reset
  - board: link_right
    shield: settings_reset
    artifact-name: link_right_reset
